name: Build

# Builds and tests every push and pull request. A push to dev also publishes the Release VSIX as a
# GitHub pre-release, which the Publish workflow then publishes to the marketplaces without rebuilding.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Set version number
      run: |
        $majorVersion = 1
        $minorVersion = 6
        $firstBuildYear = 2026
        $currentDate = Get-Date
        $currentDate = $currentDate.ToUniversalTime()
        $currentYear = $currentDate.ToString("yyyy")
        $buildYear = [Convert]::ToInt32($currentYear)
        $currentMonthDay = $currentDate.ToString("MMdd")
        $buildVersion = (($buildYear - $firstBuildYear) * 1200) + ([Convert]::ToInt32($currentMonthDay))
        echo "Current Date=$currentDate"
        echo "VERSION=$majorVersion.$minorVersion.$buildVersion.${{ github.RUN_NUMBER }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf-8 -Append

    - name: Read environmental variables
      run: |
        echo VERSION=${{ env.VERSION }}
        echo GITHUB_WORKSPACE=${{ github.WORKSPACE }}

    - name: Checkout
      uses: actions/checkout@v4

    - name: Update AssemblyInfo.cs files
      run: |
        $files = Get-ChildItem "${{ github.WORKSPACE }}" -recurse -include "*Properties*" |
            ?{ $_.PSIsContainer } |
            foreach { Get-ChildItem -Path $_.FullName -Recurse -include AssemblyInfo.* }
        if (-not $files)
        {
            Write-Host "Didn't find any files to update."
            exit 1
        }
        else
        {
            foreach ($file in $files) {
                $filecontent = Get-Content($file)
                attrib $file -r
                $filecontent -replace "\d+\.\d+\.\d+\.\d+", "${{ env.VERSION }}" | Out-File $file
                Write-Host "Version applied to '$file'"
            }
        }

    - name: Update vsixmanifest files
      run: |
        $files = Get-ChildItem "${{ github.WORKSPACE }}" -recurse -include "source.extension.vsixmanifest"
        if (-not $files)
        {
            Write-Host "Didn't find any files to update."
            exit 1
        }
        else
        {
            foreach ($file in $files) {
                $xml = [xml](Get-Content($file))
                attrib $file -r

                $node = $xml.PackageManifest.Metadata.Identity
                $node.Version = "${{ env.VERSION }}"

                $xml.Save($file)
                Write-Host "Version applied to '$file'"
            }
        }

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1

    - name: Build
      run: msbuild ".\DiffFinder.sln" /restore /p:Configuration=${{ matrix.Configuration }} /p:Platform="Any CPU"

    - name: Test
      run: vstest.console.exe "DiffFinder.Tests\bin\${{ matrix.Configuration }}\net472\DiffFinder.Tests.dll"

    # Upload the VSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ShelvesetComparer-${{ env.VERSION }}-${{ matrix.Configuration }}
        path: DiffFinder\bin\${{ matrix.Configuration }}\ShelvesetComparer.vsix
        if-no-files-found: error

  prerelease:
    name: Publish the GitHub pre-release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ShelvesetComparer-*-Release
          path: artifacts

      # The version is in the name of the artifact, the one the Release build stamped into the VSIX
      - name: Publish the pre-release
        shell: bash
        run: |
          artifact=$(ls -d artifacts/ShelvesetComparer-*-Release | head -n 1)
          version=$(basename "$artifact" | sed -E 's/^ShelvesetComparer-(.*)-Release$/\1/')
          tag="v$version"

          gh release create "$tag" "$artifact/ShelvesetComparer.vsix" --prerelease --latest=false --title "$tag" --generate-notes --target "$GITHUB_SHA"
          echo "Published the GitHub pre-release $tag. Run the Publish workflow to publish it to the Visual Studio Marketplace and the Open VSIX Gallery." >> "$GITHUB_STEP_SUMMARY"
